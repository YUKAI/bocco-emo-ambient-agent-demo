#cloud-config
# This is a tracked template. Do not put real credentials in this file.
# render_config.py fills the placeholders from the git-ignored root .env.
# The generated user-data remains on /boot/firmware in readable form, so it
# must be removed before the device is returned or handed to somebody else.

hostname: __PI_HOSTNAME_YAML__

# Unlock the base image's locked pi account by assigning the local password.
chpasswd:
  expire: false
  users:
    - name: pi
      password: __PI_PASSWORD_YAML__
      type: text

ssh_pwauth: true

write_files:
__WIFI_WRITE_FILE__
  # Runtime configuration for the agent and bridge. The content is Base64 to
  # keep arbitrary token characters from breaking YAML; Base64 is not encryption.
  - path: /home/pi/.env
    owner: pi:pi
    permissions: '0600'
    encoding: b64
    content: __RUNTIME_ENV_B64__

runcmd:
  # Load the generated NetworkManager connection, if Wi-Fi was configured.
  - nmcli connection reload || true
